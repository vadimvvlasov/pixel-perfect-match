openapi: 3.1.0

info:
  title: fieldsr-demo API
  version: 1.0.0
  summary: Field boundaries by click - jobs for a point and a date, computed by a runner on the owner's machine.
  description: |
    The contract between the UI (`web/`), the runner (`runner/runner.py`, `runner/fake_runner.py`) and the
    Cloudflare Worker (`worker/`). It is written by hand and is the source of truth: `worker/test/contract.test.ts`
    fails when a Worker route is missing here (or the other way round), and every response the Worker tests
    produce is checked against the documented status and schema.

    Conventions:
    - Dates are `YYYY-MM-DD`; timestamps are ISO 8601 strings in UTC.
    - JSON field names are `snake_case`. Nullable fields are always present with `null`.
    - Errors are `{ "error": "<message>" }`; the message is safe to show to people.

    Authentication (`AUTH_MODE` of the Worker):
    - `keys` (production): a person opens a personal link `GET /login?key=...` once and gets the session cookie
      `fsr_session`; the runner sends `x-runner-token`. Without a session every page redirects to `/login`.
    - `access`: Cloudflare Access in front; people send the `Cf-Access-Jwt-Assertion` header (set by Access),
      the runner an Access service token.
    - `dev` (`wrangler dev` only): everybody is `DEV_USER_EMAIL`; the runner sends `x-runner-token`.

    People's operations answer `403` without a valid identity, and so do runner operations called by a person
    (and the other way round).

servers:
  - url: https://fieldsr-demo.afwa006.workers.dev
    description: Production
  - url: http://localhost:8787
    description: Local `make dev` (AUTH_MODE=dev)

tags:
  - name: auth
    description: Sign-in pages of AUTH_MODE=keys (HTML, not JSON).
  - name: people
    description: The UI's operations.
  - name: runner
    description: The runner's polling protocol. Shared by runner.py and fake_runner.py.

security:
  - session: []
  - accessJwt: []

paths:
  /login:
    get:
      tags: [auth]
      operationId: login
      summary: The login page, or sign in with a personal key from an invitation link
      security: []
      parameters:
        - name: key
          in: query
          required: false
          schema: { type: string }
          description: The access key from `make invite`. Without it the login form is shown.
      responses:
        "200": { $ref: "#/components/responses/LoginPage" }
        "302": { $ref: "#/components/responses/SignedIn" }
        "403": { $ref: "#/components/responses/LoginRejected" }
        "500": { description: "SESSION_SECRET is not set", content: { text/plain: { schema: { type: string } } } }
    post:
      tags: [auth]
      operationId: loginForm
      summary: Sign in with the key typed into the login form
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        "200": { $ref: "#/components/responses/LoginPage" }
        "302": { $ref: "#/components/responses/SignedIn" }
        "403": { $ref: "#/components/responses/LoginRejected" }
        "500": { description: "SESSION_SECRET is not set", content: { text/plain: { schema: { type: string } } } }

  /logout:
    get:
      tags: [auth]
      operationId: logout
      summary: Forget the session cookie
      security: []
      responses:
        "302":
          description: Redirect to `/login`; the cookie is cleared (`Max-Age=0`).
          headers:
            Location: { schema: { type: string, const: /login } }
            Set-Cookie: { schema: { type: string } }

  /api/me:
    get:
      tags: [people]
      operationId: getMe
      summary: Who is signed in
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/jobs:
    post:
      tags: [people]
      operationId: createJob
      summary: Ask for the fields around a point for a date interval (or one date)
      description: |
        The runner finds the 10 km grid cell of the point and the clearest scene. Send `start` and `end` (at most
        366 days apart); the older `date` alone still works and means `start = end = date`. Until the runner
        understands intervals it searches near `start` (the job's `date`). A person has at most
        `MAX_ACTIVE_JOBS_PER_USER` (3) jobs in progress and `MAX_JOBS_PER_DAY_PER_USER` (20) jobs per 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "201":
          description: The job, queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyJobs" }
    get:
      tags: [people]
      operationId: listJobs
      summary: The signed-in person's last 20 jobs, newest first
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/jobs/{id}:
    get:
      tags: [people]
      operationId: getJob
      summary: One of the signed-in person's jobs (the UI polls it every 3 s until it is finished)
      description: Someone else's job answers 404, like a missing one.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/results:
    get:
      tags: [people]
      operationId: listResults
      summary: Computed cells in a bounding box (the dashed overview on the map), newest result per cell
      parameters:
        - name: bbox
          in: query
          required: true
          description: "`minx,miny,maxx,maxy` in degrees (EPSG:4326)."
          schema: { type: string, examples: ["-94,41,-93,42"] }
      responses:
        "200":
          description: At most 500 complete results.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResultMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/results/{id}:
    get:
      tags: [people]
      operationId: getResult
      summary: One result's metadata
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/results/{id}/fields.geojson:
    get:
      tags: [people]
      operationId: getFields
      summary: The field polygons of a result (streamed from KV, several MB)
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: download
          in: query
          required: false
          description: 'Any value adds `Content-Disposition: attachment; filename="fields-<id>.geojson"`.'
          schema: { type: string }
      responses:
        "200":
          description: A GeoJSON FeatureCollection of Polygons with `properties.area_ha`.
          headers:
            Cache-Control: { schema: { type: string, const: "private, max-age=86400" } }
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/FeatureCollection" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runner/recover:
    post:
      tags: [runner]
      operationId: recoverJobs
      summary: At runner start - requeue jobs left in progress (up to 3 attempts per job)
      security: [{ runnerToken: [] }, { accessJwt: [] }]
      responses:
        "200":
          description: How many jobs went back to the queue.
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                additionalProperties: false
                properties:
                  requeued: { type: integer, minimum: 0 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runner/next:
    get:
      tags: [runner]
      operationId: claimNextJob
      summary: Claim the oldest queued job (it becomes `locating`)
      description: When the queue is empty the Worker reads only a KV flag, so Neon can stay asleep.
      security: [{ runnerToken: [] }, { accessJwt: [] }]
      responses:
        "200":
          description: The claimed job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "204": { description: The queue is empty. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runner/jobs/{id}/status:
    post:
      tags: [runner]
      operationId: setJobStatus
      summary: Report progress or the outcome of a job
      security: [{ runnerToken: [] }, { accessJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusUpdate" }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: No such job, or it is already finished (finished jobs never change).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/runner/lookup:
    get:
      tags: [runner]
      operationId: lookupResult
      summary: A complete stored result for (cell, scene date, model version), to skip the model
      security: [{ runnerToken: [] }, { accessJwt: [] }]
      parameters:
        - { name: cell, in: query, required: true, schema: { type: string } }
        - { name: scene_date, in: query, required: true, schema: { $ref: "#/components/schemas/Date" } }
        - name: model
          in: query
          required: true
          description: The result version (model version + a hash of the vectorization settings).
          schema: { type: string }
      responses:
        "200":
          description: The result id, or null.
          content:
            application/json:
              schema:
                type: object
                required: [result_id]
                additionalProperties: false
                properties:
                  result_id: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runner/results:
    post:
      tags: [runner]
      operationId: upsertResult
      summary: Register a result (idempotent per cell, scene date and model version)
      security: [{ runnerToken: [] }, { accessJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewResult" }
      responses:
        "200":
          description: The result's id; `complete` is true when its polygons are already uploaded.
          content:
            application/json:
              schema:
                type: object
                required: [id, complete]
                additionalProperties: false
                properties:
                  id: { type: integer }
                  complete: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runner/results/{id}/fields:
    put:
      tags: [runner]
      operationId: uploadFields
      summary: Upload the field polygons of a result (streamed into KV, never parsed); marks it complete
      security: [{ runnerToken: [] }, { accessJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: n, in: query, required: true, description: The number of features., schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/geo+json:
            schema: { $ref: "#/components/schemas/FeatureCollection" }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fsr_session
      description: AUTH_MODE=keys. Set by `/login`; HttpOnly, Secure, SameSite=Lax, 30 days.
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: AUTH_MODE=access. Set by Cloudflare Access; people carry `email`, the runner's service token `common_name`.
    runnerToken:
      type: apiKey
      in: header
      name: x-runner-token
      description: AUTH_MODE=keys (`RUNNER_TOKEN` secret) and dev (`DEV_RUNNER_TOKEN`).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Invalid input; the message says what is expected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: No valid identity, or a person on a runner route (or the other way round).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such job or result.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyJobs:
      description: Over the limit of jobs in progress or of jobs per 24 hours.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LoginPage:
      description: The login form (AUTH_MODE=keys). In other modes `/login` redirects to `/` (302).
      content:
        text/html: { schema: { type: string } }
    SignedIn:
      description: |
        A valid key: the session cookie is set and the browser goes to `/`. In other modes: a redirect to `/`
        without a cookie.
      headers:
        Location: { schema: { type: string } }
        Set-Cookie: { schema: { type: string } }
    LoginRejected:
      description: An unknown or revoked key; the login form with an error, no cookie.
      content:
        text/html: { schema: { type: string } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Ok:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { const: true }

    Me:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }

    Date:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"

    JobStatus:
      type: string
      enum: [queued, locating, waiting_gpu, running, done, failed, no_scene]
      description: "`done`, `failed` and `no_scene` are final."

    JobRequest:
      type: object
      required: [lon, lat]
      description: "Dates are between 2017-01-01 (Sentinel-2 L2A) and today: `start` and `end`, or the older `date`."
      oneOf:
        - required: [start, end]
        - required: [date]
          not: { anyOf: [{ required: [start] }, { required: [end] }] }
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -90, maximum: 90 }
        start: { $ref: "#/components/schemas/Date" }
        end:
          allOf: [{ $ref: "#/components/schemas/Date" }]
          description: Not before `start`, at most 366 days after it.
        date:
          allOf: [{ $ref: "#/components/schemas/Date" }]
          deprecated: true
          description: One date; the same as `start = end = date`.

    Job:
      type: object
      required: [id, lon, lat, date, start_date, end_date, status, message, cell, scene_date, result_id, requested_by, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: integer }
        lon: { type: number }
        lat: { type: number }
        date:
          allOf: [{ $ref: "#/components/schemas/Date" }]
          description: "= `start_date`: the date the runner searches near until it understands intervals."
        start_date:
          allOf: [{ $ref: "#/components/schemas/Date" }]
          description: The interval asked for. One date (or a job from before intervals) is `start_date = end_date = date`.
        end_date: { $ref: "#/components/schemas/Date" }
        status: { $ref: "#/components/schemas/JobStatus" }
        message: { type: [string, "null"] }
        cell: { type: [string, "null"], description: "Grid cell id, e.g. `15TUH_9_9`; known after `locating`." }
        scene_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        result_id: { type: [integer, "null"] }
        requested_by: { type: string, description: Email of the person who asked. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          allOf: [{ $ref: "#/components/schemas/JobStatus" }]
          not: { const: queued }
        message: { type: [string, "null"] }
        cell: { type: [string, "null"] }
        scene_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        result_id: { type: [integer, "null"] }

    ResultMeta:
      type: object
      required: [id, cell, scene_id, scene_date, model_version, cell_geom, n_fields, complete]
      additionalProperties: false
      properties:
        id: { type: integer }
        cell: { type: string }
        scene_id: { type: string }
        scene_date: { $ref: "#/components/schemas/Date" }
        model_version: { type: string, description: The result version the runner computed it with. }
        cell_geom: { $ref: "#/components/schemas/Polygon" }
        n_fields: { type: [integer, "null"] }
        complete: { type: boolean, description: True once the polygons are in KV. }

    NewResult:
      type: object
      required: [cell, scene_id, scene_date, model_version, cell_geom]
      properties:
        cell: { type: string }
        scene_id: { type: string }
        scene_date: { $ref: "#/components/schemas/Date" }
        model_version: { type: string }
        cell_geom: { $ref: "#/components/schemas/Polygon" }

    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: Polygon }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items: { type: number }

    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { const: Feature }
              geometry: { type: object }
              properties: { type: [object, "null"] }
